[package]
name = "backend"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
axum = { version = "0.8.1", features = ["ws"] }
tower-http = { version = "0.6.1", features = ["fs", "trace"] }
tokio = { version = "1.0", features = ["full"] }
serde = "1"
types = { path = "../types" }
interface = { path = "../interface" }
kasuku-database = { path = "../../utils/database" }
context = { path = "../../utils/context" }
distribution = { path = "../../utils/distribution" }
markdown = { path = "../../utils/files/markdown", features = ["backend"] }
node = { path = "../../utils/node" }
plugy = { git = "https://github.com/geofmureithi/plugy.git", branch = "chore/msgpack-codec", default-features = false, features = [
    "runtime",
    "macros",
] }
anyhow = "1"
heck = "0.4"
hirola = { version = "0.4.0", default-features = false }
serde_json = "1"
figment = { version = "0.10", features = ["toml", "env"] }
notify = "6.1.1"
futures = "0.3"
pulldown-cmark = { version = "0.12.2" }
tracing-subscriber = { version = "0.3.11", features = ["env-filter", "json"] }
tokio-stream = "0.1"
walkdir = "2.3"

[dependencies.tracing]
default-features = false
version = "0.1"
