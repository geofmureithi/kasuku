[package]
name = "kasuku-database"
version = "0.1.0"
readme = "README.md"
edition = "2021"

[dependencies]
async-trait = "0.1.73"
anyhow = "1"
futures = "0.3"
tokio-rusqlite = "0.6.0"
serde = "1"
serde_json = { version = "1.0.107", features = ["preserve_order"] }
tokio = "1"
sqlparser = "0.30"
types = { path = "../../core/types" }
tracing = "0.1"

[dev-dependencies]
rusqlite = "*"
serde_bytes = "0.11"
