[package]
name = "markdown"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[features]
default = ["backend"]
backend = ["tokio", "pulldown-cmark/html"]

[dependencies]
pulldown-cmark = { version = "0.12.2", features = ["serde", "html"] }
types = { path = "../../../core/types" }
serde = { version = "1", features = ["rc"] }
plugy = { git = "https://github.com/geofmureithi/plugy.git", branch = "chore/msgpack-codec", default-features = false, features = [
    "core",
] }
tokio = { version = "1", optional = true }
regex = { version = "1.11.1" }
macros = { path = "../../../core/macros" }
serde_regex = { version = "1.1.0" }
